<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ND Enterprises Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: blueprint-style workbench. Fixed left rail of plant modules, wide working canvas, ledger-like tables. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --sunk:#e4e8ed; --line:#d3d9e0; --fg:#18212b; --muted:#5b6876;
  --accent:#1d55b8; --accent-ink:#ffffff; --accent-soft:#dde7f8;
  --good:#1d7a4c; --good-soft:#dcf1e5; --warn:#a85d00; --warn-soft:#fbecd6; --bad:#b3261e; --bad-soft:#f9dedc;
  --rail:#16202b; --rail-fg:#c5d0dc; --rail-active:#ffffff;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#161e27; --sunk:#1c2631; --line:#2a3542; --fg:#e3e9ef; --muted:#93a1b0;
  --accent:#6c9cf0; --accent-ink:#0b1320; --accent-soft:#1d2d4a;
  --good:#5cc994; --good-soft:#15332a; --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#f08a80; --bad-soft:#3d1c1a;
  --rail:#0a0f14; --rail-fg:#8d9bab; --rail-active:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#161e27; --sunk:#1c2631; --line:#2a3542; --fg:#e3e9ef; --muted:#93a1b0;
  --accent:#6c9cf0; --accent-ink:#0b1320; --accent-soft:#1d2d4a;
  --good:#5cc994; --good-soft:#15332a; --warn:#f0a94a; --warn-soft:#3a2a12; --bad:#f08a80; --bad-soft:#3d1c1a;
  --rail:#0a0f14; --rail-fg:#8d9bab; --rail-active:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-fg);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;color:var(--rail-active)}
.brand-mark{width:34px;height:34px;border:2px solid currentColor;border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.02em}
.brand b{font-family:var(--f-display);font-weight:800;font-size:16px;display:block;letter-spacing:.01em}
.brand small{font-size:11px;color:var(--rail-fg)}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--rail-fg);opacity:.7;padding:0 10px 4px}
.nav-btn{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:5px;font-size:13.5px;color:var(--rail-fg)}
.nav-btn:hover{background:rgba(255,255,255,.06);color:var(--rail-active)}
.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nav-btn.on{background:rgba(255,255,255,.1);color:var(--rail-active);font-weight:600}
.nav-btn .pill{font-size:11px;font-family:var(--f-mono);background:var(--warn);color:#1b1206;border-radius:9px;padding:0 6px}
.rail-foot{margin-top:auto;font-size:11.5px;line-height:1.5;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.rail-foot .mono{color:var(--rail-active)}
/* main */
main{min-width:0;padding-block:22px 48px;padding-left:max(16px,2.4vw);padding-right:max(16px,env(safe-area-inset-right,0px),2.4vw)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.head h1{font-family:var(--f-display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted);max-width:68ch}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-sale{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-family:var(--f-display);font-size:15px;font-weight:700;margin:0;letter-spacing:.005em}
.card-b{padding:14px 16px}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.tile.alert .v{color:var(--warn)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--sunk)}
th.num{text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.low{background:var(--warn-soft);color:var(--warn)}
.chip.out{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.inp:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:11px 16px;font-size:14px;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
form.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:7px 9px;min-width:0}
.inp.sm{width:88px;padding:5px 7px;text-align:right;font-family:var(--f-mono)}
.inp.xs{width:70px;padding:4px 6px;text-align:right;font-family:var(--f-mono)}
.fm .full{grid-column:1/-1}
.sku{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13.5px}
.totals .grand{font-family:var(--f-display);font-weight:800;font-size:22px;padding-top:8px;border-top:1px solid var(--line)}
.totals .lbl-grand{padding-top:12px;border-top:1px solid var(--line);font-weight:600}
.rateplate{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rateplate .big{font-family:var(--f-mono);font-size:17px;font-weight:500;color:var(--fg)}
.ratestrip{display:flex;gap:6px;flex-wrap:wrap}
.ratestrip .r{font-family:var(--f-mono);font-size:11.5px;background:var(--sunk);border-radius:4px;padding:3px 7px}
.ccy-seg{display:flex;flex-wrap:wrap;gap:4px}
.ccy-seg button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:5px 10px;font-family:var(--f-mono);font-size:12.5px;cursor:pointer}
.ccy-seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.scanbar{display:flex;gap:8px;flex-wrap:wrap}
.scanbar .inp{flex:1 1 200px}
.qrbtn{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qrbtn:hover{filter:brightness(1.15)}
.bar-row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow-y:auto;padding-block:max(24px,env(safe-area-inset-top,0px)) 24px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:min(760px,100%);box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal.wide{width:min(880px,100%)}
.scan-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.viewfinder{position:relative;aspect-ratio:4/3;max-width:100%;background:#0b0f14;border-radius:6px;overflow:hidden;display:grid;place-items:center;color:#9fb0c2;text-align:center;font-size:12.5px;padding:12px}
.viewfinder video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewfinder .reticle{position:absolute;inset:18%;border:2px solid rgba(255,255,255,.75);border-radius:8px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.viewfinder .laser{position:absolute;left:18%;right:18%;height:2px;background:#ff5a4f;top:50%;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:22%}to{top:78%}}
@media (prefers-reduced-motion: reduce){.viewfinder .laser{animation:none}}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.label{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:5px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;color:#18212b;font-size:10.5px;text-align:center}
.label:hover,.label:focus-visible{outline:2px solid var(--accent)}
.label img{width:78px;height:78px;image-rendering:pixelated}
.label b{font-family:var(--f-mono);font-size:10.5px}
.hit{border:1px solid var(--good);background:var(--good-soft);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px}
.stepper{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--panel)}
.stepper button{border:0;background:var(--sunk);width:30px;cursor:pointer;font-size:16px}
.stepper input{width:64px;border:0;text-align:center;font-family:var(--f-mono);background:var(--panel);padding:5px 0}
/* invoice */
.invoice{color:#1a1f26;background:#fff;padding:26px 28px;font-size:12.5px;border-radius:8px}
.invoice h3{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:.02em}
.invoice table th{background:#f1f3f6;color:#4b5664;border-color:#dde2e8}
.invoice table td{border-color:#e6e9ee}
.invoice .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:16px 0}
.invoice .meta div{font-size:12px;line-height:1.5}
.invoice .meta .k{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#6b7684;font-weight:600}
.invoice .sum{margin-left:auto;width:min(340px,100%);margin-top:12px}
.invoice .sum .totals .grand{border-color:#dde2e8}
.invoice .note{margin-top:16px;padding:10px 12px;background:#f4f6f9;border-radius:5px;font-size:11.5px;color:#4b5664}
.inv-ribbon{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;border-bottom:2px solid #1a1f26;padding-bottom:12px}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-size:13px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.demo-flag{font-size:11px;padding:2px 8px;border-radius:3px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.var-pos{color:var(--good)} .var-neg{color:var(--bad)}
.hide-sm{}
/* sign-in */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login-brand{background:var(--rail);color:var(--rail-fg);padding-block:44px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.nd-mark{width:56px;height:56px;border:3px solid var(--rail-active);color:var(--rail-active);border-radius:5px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.02em}
.login-brand b{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--rail-active);display:block}
.login-h{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3.4vw,40px);line-height:1.1;color:var(--rail-active);margin:0 0 12px;max-width:16ch;text-wrap:balance}
.login-brand p{margin:0;max-width:46ch}
.login-mods{display:flex;flex-wrap:wrap;gap:6px}
.login-mods span{font-size:11.5px;border:1px solid rgba(255,255,255,.18);border-radius:3px;padding:3px 8px}
.login-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-card{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.login-card h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:2px 0 0}
.pw-wrap{position:relative}
.pw-wrap .inp{padding-right:58px}
.pw-wrap button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;padding:4px 8px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.demo-acc{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.demo-acc button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:4px}
.demo-acc button:hover,.demo-acc button:focus-visible{background:var(--sunk)}
.err{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:5px;padding:8px 10px;font-size:12.5px}
.who{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.who b{color:var(--rail-active);font-size:13px}
@media (max-width:820px){.login{grid-template-columns:minmax(0,1fr)}.login-brand{padding-block:26px;padding-right:max(24px,env(safe-area-inset-right,0px));padding-left:max(24px,env(safe-area-inset-left,0px));gap:18px}.login-brand p,.login-mods{display:none}}
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-sale{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding-block:8px;gap:10px;z-index:20;padding-right:max(14px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
  .brand small,.nav-label,.rail-foot{display:none}
  .nav-group{flex-direction:row}
  .nav-btn{white-space:nowrap}
  .g-2,.scan-grid{grid-template-columns:minmax(0,1fr)}
  .hide-sm{display:none}
}
@media (max-width:520px){.g-4{grid-template-columns:minmax(0,1fr)}.head h1{font-size:22px}.invoice{padding:18px 14px}}
</style>
</head>
<body>

<div id="login" hidden></div>
<div class="app" id="app" hidden>
  <nav class="rail" id="rail" aria-label="Modules"></nav>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<input type="file" id="qr-file" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ============ Reference data ============ */
const CCY = {
  INR:{name:'Indian Rupee',locale:'en-IN'}, USD:{name:'US Dollar',locale:'en-US'}, EUR:{name:'Euro',locale:'de-DE'},
  GBP:{name:'British Pound',locale:'en-GB'}, AED:{name:'UAE Dirham',locale:'en-AE'}, JPY:{name:'Japanese Yen',locale:'ja-JP'},
  SGD:{name:'Singapore Dollar',locale:'en-SG'}, CNY:{name:'Chinese Yuan',locale:'zh-CN'}
};
// Units of currency per 1 INR. Used until a live fetch succeeds.
const SAMPLE_RATES = {INR:1, USD:0.01189, EUR:0.01093, GBP:0.00915, AED:0.04367, JPY:1.795, SGD:0.01547, CNY:0.08465};
const RATE_API = 'https://open.er-api.com/v6/latest/INR';
const KEY = 'nd.desk.v1';
const SESSION_KEY = 'nd.session';
const IDLE_MINUTES = 30;

/* ============ Helpers ============ */
const $ = (s,r=document)=>r.querySelector(s);
const uid = ()=>Math.random().toString(36).slice(2,9);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const daysAgo = n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const today = ()=>new Date().toISOString().slice(0,10);
const fmtDate = s=>new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
function money(v,c){
  const dp = c==='JPY'?0:2;
  try{return new Intl.NumberFormat(CCY[c]?.locale||'en-IN',{style:'currency',currency:c,minimumFractionDigits:dp,maximumFractionDigits:dp}).format(v||0)}
  catch(e){return c+' '+(v||0).toFixed(dp)}
}
const qty = n=>new Intl.NumberFormat('en-IN').format(n);

/* ============ State ============ */
function seed(){
  const items=[
    {sku:'FLG-2040',name:'Weld-neck flange 4" SS304',cat:'Flanges',hsn:'7307',unit:'pcs',price:1850,cost:1320,stock:240,reorder:80,loc:'A-01'},
    {sku:'BRG-6205',name:'Ball bearing 6205-2RS',cat:'Bearings',hsn:'8482',unit:'pcs',price:265,cost:180,stock:1200,reorder:300,loc:'B-04'},
    {sku:'SHF-1260',name:'Drive shaft EN8 Ø60 × 1200 mm',cat:'Shafts',hsn:'8483',unit:'pcs',price:7400,cost:5100,stock:36,reorder:20,loc:'C-02'},
    {sku:'GSK-0410',name:'Spiral wound gasket 4" 150#',cat:'Seals',hsn:'8484',unit:'pcs',price:420,cost:260,stock:64,reorder:100,loc:'A-03'},
    {sku:'CST-7712',name:'Pump housing casting FG260',cat:'Castings',hsn:'7325',unit:'pcs',price:12800,cost:9200,stock:18,reorder:10,loc:'D-01'},

/* ============ Currency maths ============ */
// perINR(c): units of c for 1 INR, honouring manual overrides (stored as INR per 1 unit).
function perINR(c){ const o=S.settings.overrides[c]; return o? 1/o : (S.settings.rates[c] ?? SAMPLE_RATES[c] ?? 1) }
function conv(v,from,to){ return from===to? v : v / perINR(from) * perINR(to) }
function rateText(c,base=S.settings.base){ return c===base? '—' : `1 ${c} = ${money(conv(1,c,base),base)}` }

function fyCode(d=new Date()){ const y=d.getMonth()>=3?d.getFullYear():d.getFullYear()-1; return `${String(y).slice(2)}-${String(y+1).slice(2)}` }
function buildSale(st,cust,currency,lines){
  const base=st.settings.base;
  const sub=lines.reduce((a,l)=>a+l.qty*l.price,0);
  const domestic=cust.country==='India';
  const tax=domestic? sub*st.settings.gst/100 : 0;
  st.settings.seq++;
  const mult = currency===base?1: (1/((st.settings.overrides[base]?1/st.settings.overrides[base]:st.settings.rates[base]))) * (st.settings.overrides[currency]?1/st.settings.overrides[currency]:st.settings.rates[currency]);
  return {id:uid(),no:`ND/${fyCode()}/${String(st.settings.seq).padStart(4,'0')}`,date:today(),custId:cust.id,currency,base,mult,
    lines,sub,tax,taxMode:domestic?'GST':'LUT',total:sub+tax,rateSource:st.settings.ratesSource};
}

function parseQR(text){
  let t=String(text).trim(), q=1;
  try{ const j=JSON.parse(t); if(j&&j.sku) return {sku:j.sku,qty:+j.qty||1} }catch(e){}
  const m=t.split('|'); if(m.length>1){ t=m[0]; q=parseInt(m[1],10)||1 }
  return {sku:t,qty:q};
}

}

// Prototype sign-in: salted SHA-256 hashes kept in this browser. Replace with a server-side identity provider for production.
const ROLES={admin:'Administrator',sales:'Sales',stores:'Stores'};
const ACCESS={admin:'*',sales:['dashboard','sale','sales','customers','items'],stores:['dashboard','items','stockin','recon','ledger','vendors']};
const DEMO_USERS=[['Neha Desai','admin','admin','nd@admin26'],['Rahul Iyer','sales','sales','nd@sales26'],['Sunil Patil','stores','stores','nd@stores26']];
let me=null, lastActive=Date.now(), fails={n:0,until:0};
const can=v=>!!me&&(ACCESS[me.role]==='*'||ACCESS[me.role].includes(v));
async function hashPw(pw,salt){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function makeUser(name,username,role,pw){ const salt=uid()+uid(); return {id:uid(),name,username:username.toLowerCase(),role,salt,hash:await hashPw(pw,salt),active:true,lastLogin:null} }
function readSession(){
  for(const st of [()=>sessionStorage,()=>localStorage]){
    try{ const s=JSON.parse(st().getItem(SESSION_KEY)||'null'); if(s&&s.exp>Date.now()) return s }catch(e){}
  }
  return null;
}
function writeSession(userId,keep){
  const s=JSON.stringify({uid:userId,exp:Date.now()+(keep?12*3600e3:IDLE_MINUTES*60e3*16)});
  try{ (keep?localStorage:sessionStorage).setItem(SESSION_KEY,s) }catch(e){}
}
function clearSession(){ try{sessionStorage.removeItem(SESSION_KEY)}catch(e){} try{localStorage.removeItem(SESSION_KEY)}catch(e){} }
function signOut(msg){ me=null; clearSession(); closeModal(); cart={custId:null,currency:null,lines:[]}; renderLogin(msg) }

async function handleLogin(d){
  if(Date.now()<fails.until) return renderLogin(`Too many attempts. Try again in ${Math.ceil((fails.until-Date.now())/1000)} seconds.`);
  if(!(window.crypto&&crypto.subtle)) return renderLogin('Sign-in needs a secure page. Open the app over https:// or localhost.');
  const u=S.users.find(x=>x.username===String(d.username||'').trim().toLowerCase());
  const ok=u && u.hash===await hashPw(String(d.password||''),u.salt);
  if(!ok){ fails.n++; if(fails.n>=5){fails={n:0,until:Date.now()+60e3}; return renderLogin('Too many attempts. Sign-in is locked for one minute.')} return renderLogin('Username or password is incorrect.') }
  if(!u.active) return renderLogin('This account is disabled. Ask an administrator to enable it.');
  fails={n:0,until:0}; u.lastLogin=Date.now(); save(); me=u; writeSession(u.id,!!d.keep); view='dashboard'; enterApp(); toast(`Signed in as ${u.name}`);
}

/* ============ Rates fetch ============ */
async function fetchRates(silent){
  try{
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(RATE_API,{signal:ctl.signal}); clearTimeout(t);
    const j=await r.json();
    if(j.result!=='success'||!j.rates) throw new Error('bad response');
    Object.keys(CCY).forEach(c=>{ if(j.rates[c]) S.settings.rates[c]=j.rates[c] });
    S.settings.rates.INR=1; S.settings.ratesSource='live'; S.settings.ratesAt=Date.now(); save(); render();
    if(!silent) toast('Live INR rates updated');
  }catch(e){
    if(!silent) toast('Couldn’t reach the rate service. Using saved rates; enter overrides if needed.');
  }
}

let scanHit=null, camStream=null, camRAF=0;
function scanModal(){

function showHit(text){
  const p=parseQR(text), i=findBySku(p.sku), box=$('#scan-result');
  if(!box) return;
  if(!i){ scanHit=null; box.innerHTML=`<div class="hit" style="border-color:var(--bad);background:var(--bad-soft)"><b>No item for “${esc(text)}”</b><span style="font-size:12.5px">Check the label or add the SKU in the stock master.</span></div>`; return }
  scanHit={itemId:i.id,qty:p.qty};
  const cur=cart.currency||S.settings.base;
  box.innerHTML=`<div class="hit"><div class="spread"><span class="chip ok">Scanned</span><span class="mono" style="font-size:12px">${esc(text)}</span></div>

    <div class="spread"><span>In stock <b class="mono">${qty(i.stock)} ${i.unit}</b></span><span class="mono">${money(conv(i.price,S.settings.base,cur),cur)} / ${i.unit}</span></div>
    <div class="spread"><div class="stepper"><button data-step="-1" aria-label="Less">−</button><input id="hit-qty" type="number" min="1" value="${p.qty}" aria-label="Quantity"><button data-step="1" aria-label="More">+</button></div>
    <button class="btn primary" data-act="hit-add">Add to bill</button></div>
    ${p.qty>i.stock?`<span style="color:var(--bad);font-size:12px">Only ${i.stock} in stock.</span>`:''}</div>`;
}
function decodeImageSrc(src){
  return new Promise(res=>{
    const img=new Image(); img.onload=()=>{
      const c=document.createElement('canvas'), w=img.naturalWidth, h=img.naturalHeight, sc=Math.min(1,1000/Math.max(w,h));
      c.width=w*sc; c.height=h*sc; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      const d=x.getImageData(0,0,c.width,c.height); const r=window.jsQR?jsQR(d.data,c.width,c.height):null; res(r?r.data:null);
    }; img.onerror=()=>res(null); img.src=src;
  });
}
async function startCamera(){
  const vf=$('#vf'), msg=$('#vf-msg');
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=document.createElement('video'); v.setAttribute('playsinline',''); v.muted=true; v.srcObject=camStream;
    vf.innerHTML=''; vf.append(v); vf.insertAdjacentHTML('beforeend','<div class="reticle"></div><div class="laser"></div>'); await v.play();
    const c=document.createElement('canvas'), x=c.getContext('2d',{willReadFrequently:true});
    const tick=()=>{
      if(!camStream) return;
      if(v.readyState>=2){ c.width=v.videoWidth; c.height=v.videoHeight; x.drawImage(v,0,0); const d=x.getImageData(0,0,c.width,c.height); const r=jsQR(d.data,c.width,c.height,{inversionAttempts:'dontInvert'});
        if(r&&r.data){ stopCamera(); vf.innerHTML='<span>Code read. Start the camera again for the next item.</span>'; showHit(r.data); return } }
      camRAF=requestAnimationFrame(tick);
    }; tick();
  }catch(e){ if(msg) msg.innerHTML='Camera isn’t available in this view.<br>Upload a photo of the label, type the code, or tap a sample label.' }
}
function stopCamera(){ cancelAnimationFrame(camRAF); if(camStream){camStream.getTracks().forEach(t=>t.stop()); camStream=null} }

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-nav],[data-act],[data-ccy],[data-rm],[data-inv],[data-label],[data-demo],[data-step],[data-toggle-ccy]');
  if(!t) return;
  if(t.dataset.act==='close-modal' && t.classList.contains('scrim') && e.target!==t) return;
  if(t.dataset.nav){ return go(t.dataset.nav) }
  if(t.dataset.ccy){ cart.currency=t.dataset.ccy; return render() }
  if(t.dataset.rm){ cart.lines.splice(+t.dataset.rm,1); return render() }
  if(t.dataset.inv){ return invoiceModal(t.dataset.inv) }
  if(t.dataset.label){ return labelModal(t.dataset.label) }
  if(t.dataset.demo){ const img=t.querySelector('img'); const r=await decodeImageSrc(img.src); return showHit(r||t.dataset.demo) }
  if(t.dataset.step){ const i=$('#hit-qty'); i.value=Math.max(1,(parseInt(i.value,10)||1)+(+t.dataset.step)); return }
  if(t.dataset.toggleCcy){ const c=t.dataset.toggleCcy, en=S.settings.enabled; if(c===S.settings.base) return;
    S.settings.enabled= en.includes(c)? en.filter(x=>x!==c) : Object.keys(CCY).filter(x=>en.includes(x)||x===c);
    if(!S.settings.enabled.includes(cart.currency)) cart.currency=S.settings.base; save(); return render() }
  switch(t.dataset.act){
    case 'scan': return scanModal();
    case 'cam-start': return startCamera();
    case 'upload-qr': return $('#qr-file').click();
    case 'manual-scan': { const v=$('#manual-code').value.trim(); if(v) showHit(v); return }
    case 'hit-add': { if(!scanHit) return; const q=Math.max(1,parseInt($('#hit-qty').value,10)||1); addToCart(scanHit.itemId,q); const i=item(scanHit.itemId); closeModal(); if(view!=='sale') view='sale'; render(); return toast(`Added ${q} × ${i.sku} to the bill`) }
    case 'clear-cart': cart.lines=[]; return render();
    case 'checkout': {
      const c=cartCust(); if(!cart.lines.length) return;
      const lines=cart.lines.map(l=>{const i=item(l.itemId);return {itemId:i.id,sku:i.sku,name:i.name,hsn:i.hsn,unit:i.unit,qty:l.qty,price:i.price}});
      const sale=buildSale(S,c,cart.currency,lines); sale.by=me.name; S.sales.push(sale);
      lines.forEach(l=>{ item(l.itemId).stock-=l.qty; S.moves.push({id:uid(),date:sale.date,itemId:l.itemId,type:'OUT',qty:l.qty,ref:sale.no,party:c.id,by:me.name}) });
      cart.lines=[]; save(); render(); invoiceModal(sale.id); return toast(`Invoice ${sale.no} created · stock updated`);
    }
    case 'fetch-rates': return fetchRates(false);
    case 'signout': return signOut();
    case 'pw-toggle': { const p=$('#lg-pw'); const show=p.type==='password'; p.type=show?'text':'password'; t.textContent=show?'Hide':'Show'; return }
    case 'fill-demo': $('#lg-user').value=t.dataset.u; $('#lg-pw').value=t.dataset.p; return;
    case 'user-toggle': { const u=S.users.find(x=>x.id===t.dataset.uid); if(!u||u.id===me.id) return; u.active=!u.active; save(); render(); return toast(`${u.name} ${u.active?'enabled':'disabled'}`) }
    case 'user-remove': { const u=S.users.find(x=>x.id===t.dataset.uid); if(!u||u.id===me.id) return;
      if(t.dataset.confirm!=='1'){ t.dataset.confirm='1'; t.textContent='Confirm remove'; return }
      S.users=S.users.filter(x=>x.id!==u.id); save(); render(); return toast(`${u.name} removed`) }
    case 'close-modal': return closeModal();
    case 'post-recon': {
      const lines=[]; let value=0;
      document.querySelectorAll('[data-count]').forEach(inp=>{ const i=item(inp.dataset.count), n=parseInt(inp.value,10); if(isNaN(n)) return; const d=n-i.stock; if(!d) return;
        const reason=$(`[data-reason="${i.id}"]`).value; lines.push({itemId:i.id,system:i.stock,counted:n,diff:d,reason}); value+=d*i.cost; i.stock=n;
        S.moves.push({id:uid(),date:today(),itemId:i.id,type:'ADJ',qty:d,ref:`RECON-${S.recons.length+1}`,note:reason}) });
      if(!lines.length) return toast('No variances to post. Change a physical count first.');
      S.recons.unshift({id:uid(),date:today(),lines,value}); save(); render(); return toast(`${lines.length} adjustment${lines.length>1?'s':''} posted to the stock ledger`);
    }
    case 'base-preview': pendingBase=$('#base-sel').value; return render();
    case 'base-cancel': pendingBase=null; return render();
    case 'base-apply': {
      const from=S.settings.base, to=pendingBase;
      S.items.forEach(i=>{ i.price=+conv(i.price,from,to).toFixed(2); i.cost=+conv(i.cost,from,to).toFixed(2) });
      S.moves.forEach(m=>{ if(m.cost!=null) m.cost=+conv(m.cost,from,to).toFixed(2) });
      S.settings.base=to; pendingBase=null; if(!S.settings.enabled.includes(to)) S.settings.enabled.push(to); save(); render(); return toast(`Base currency is now ${to}. Stock master re-priced.`);
    }
    case 'copy-inv': {
      const s=S.sales.find(x=>x.id===t.dataset.id); const txt=`${s.no} · ${cust(s.custId).name} · ${money(s.total*s.mult,s.currency)}`+(s.currency!==s.base?` (${money(s.total,s.base)})`:'');
      try{ await navigator.clipboard.writeText(txt); toast('Invoice summary copied') }catch(err){ toast(txt) } return;
    }
  }
});

(async function boot(){
  if(!S.users||!S.users.length){
    try{ S.users=await Promise.all(DEMO_USERS.map(([n,u,r,p])=>makeUser(n,u,r,p))); save() }
    catch(e){ S.users=[]; return renderLogin('Sign-in needs a secure page. Open the app over https:// or localhost.') }
  }
  const s=readSession(), u=s&&S.users.find(x=>x.id===s.uid&&x.active);
  if(u){ me=u; enterApp() } else renderLogin();
  fetchRates(true);
})();
</script>
</body>
